<!doctype html>
<html lang="en" class="h-full w-full select-none overflow-hidden touch-none" style="background-color: #070b14; color: #f1f5f9;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>The Drifting World</title>
    <meta name="description" content="A mobile-optimized first-person fantasy exploration game set across a vast luminous turquoise ocean and floating islands connected by magical resonance threads." />
    <meta property="og:title" content="The Drifting World" />
    <meta property="og:description" content="A mobile-optimized first-person fantasy exploration game set across a vast luminous turquoise ocean and floating islands connected by magical resonance threads." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0d1b2a" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Fallback styling guaranteeing the screen is never white */
      html, body {
        background-color: #070b14 !important;
        color: #f1f5f9 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #initial-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0f1c30 0%, #070b14 75%);
        font-family: 'Cinzel', serif, sans-serif;
        text-align: center;
        padding: 24px;
        z-index: 10;
      }
      .shell-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: #2dd4bf;
        text-shadow: 0 0 20px rgba(45, 212, 191, 0.4);
        margin-bottom: 12px;
      }
      .shell-subtitle {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 14px;
        color: #94a3b8;
        font-style: italic;
        margin-bottom: 28px;
      }
      .shell-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(45, 212, 191, 0.2);
        border-top-color: #2dd4bf;
        border-radius: 50%;
        animation: shellSpin 1s linear infinite;
      }
      @keyframes shellSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="h-full w-full bg-[#070b14] text-slate-100 overflow-hidden select-none m-0 p-0 font-['Plus_Jakarta_Sans',sans-serif]" style="background-color: #070b14;">
    <div id="root" class="h-full w-full">
      <!-- Initial Loading Shell (Replaced automatically when React mounts) -->
      <div id="initial-shell">
        <div class="shell-title">THE DRIFTING WORLD</div>
        <div class="shell-subtitle">Summoning the celestial islands and turquoise ocean...</div>
        <div class="shell-spinner"></div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
