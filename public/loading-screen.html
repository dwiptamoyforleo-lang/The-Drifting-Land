<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Drifting Land — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f3ecd8; --gold:#f6c978; --cyan:#8fd6e8; --moss:#5b8a3a;
  --stone1:#7b7f80; --stone2:#4d5254; --ink:#1d2326;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#1b3a6b;overflow:hidden}
body{font-family:"Cinzel",Georgia,"Times New Roman",serif;color:var(--cream)}
#scene{position:fixed;inset:0;width:100%;height:100%}
.bob{animation:bob 9s ease-in-out infinite alternate}
.bob.b2{animation-duration:12s;animation-delay:-4s}
.bob.b3{animation-duration:7s;animation-delay:-2s}
@keyframes bob{to{transform:translateY(-12px)}}
.fall{stroke-dasharray:14 10;animation:fall 1.1s linear infinite}
@keyframes fall{to{stroke-dashoffset:-24}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(3deg)}}
.glint{animation:glint 4s ease-in-out infinite alternate}
@keyframes glint{from{opacity:.55}to{opacity:1}}
.mote{position:fixed;width:4px;height:4px;border-radius:50%;background:#ffe7a8;box-shadow:0 0 8px 2px rgba(255,220,140,.7);opacity:0;animation:mote linear infinite;pointer-events:none}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}85%{opacity:.7}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}

.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:clamp(12px,3.5vh,40px) 16px;pointer-events:none}
.stage>*{pointer-events:auto}
.title{text-align:center;line-height:1;margin:0;filter:drop-shadow(0 4px 10px rgba(10,25,60,.55))}
.title .the{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:700;font-size:clamp(18px,3.4vw,44px);letter-spacing:.18em;color:var(--cream)}
.title .the::before,.title .the::after{content:"";height:2px;width:clamp(50px,11vw,150px);background:linear-gradient(90deg,transparent,var(--cream))}
.title .the::after{transform:scaleX(-1)}
.title .name{display:block;margin-top:.1em;font-weight:900;font-size:clamp(40px,9vw,118px);letter-spacing:.015em;
  background:linear-gradient(180deg,#fbf6e6 0%,#e6dcc2 45%,#aaa088 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1px rgba(90,80,60,.35)}
.title .name b{font-size:1.22em;font-weight:900}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
.rule i{height:2px;width:clamp(70px,16vw,230px);background:linear-gradient(90deg,transparent,var(--cream))}
.rule i:last-child{transform:scaleX(-1)}
.rule svg{width:clamp(26px,4vw,46px);height:auto}

.slab{position:relative;margin-top:auto;margin-bottom:clamp(8px,4vh,40px);width:min(470px,92vw);padding:30px 34px 26px;border-radius:22px 22px 14px 14px;
  background:
   radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.14),transparent 60%),
   linear-gradient(180deg,var(--stone1),var(--stone2));
  border:2px solid #2f3537;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -6px 14px rgba(0,0,0,.35),0 18px 40px rgba(8,18,40,.5);
  text-align:center}
.slab::before,.slab::after{content:"";position:absolute;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#8fc255,#4c7a2e 60%,transparent 72%)}
.slab::before{left:-26px;top:-20px;width:120px;height:90px;box-shadow:54px -4px 0 -14px #5f9a3a,20px 58px 0 -26px #4c7a2e}
.slab::after{right:-24px;top:-16px;width:110px;height:80px;box-shadow:-46px -10px 0 -12px #6aa640,-6px 64px 0 -24px #4c7a2e}
.vine{position:absolute;top:-6px;left:22%;right:22%;height:16px;border-radius:50%;background:radial-gradient(#7dae48 30%,transparent 70%);opacity:.9;pointer-events:none}
.status{margin:0 0 16px;font-size:clamp(14px,1.9vw,19px);font-weight:700;letter-spacing:.08em;color:#efe6cc;text-shadow:0 2px 3px rgba(0,0,0,.6)}
.bar{position:relative;height:22px;border-radius:12px;background:#1d2326;border:2px solid #2b3235;box-shadow:inset 0 3px 7px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.18);overflow:hidden}
.fill{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#c88a3a,var(--gold) 55%,var(--cyan));box-shadow:0 0 14px rgba(246,201,120,.7);position:relative;transition:width .25s linear}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:200% 100%;animation:shine 1.8s linear infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-100% 0}}
.meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-size:13px;letter-spacing:.1em;color:#d9d3bf}
.pct{font-size:20px;font-weight:900;color:var(--gold);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tip{margin:16px 0 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);min-height:3.2em;font-weight:500;font-size:clamp(12px,1.5vw,14px);line-height:1.6;letter-spacing:.03em;color:#e4ddc7;transition:opacity .5s}
.go{display:none;margin-top:16px;font:700 16px/1 "Cinzel",Georgia,serif;letter-spacing:.1em;color:var(--cream);padding:13px 30px;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#8a8e8e,#565b5d);border:2px solid #2f3537;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.4)}
.go:hover{filter:brightness(1.12)}
.go:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.done .go{display:inline-block}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}
.option{font:700 11px/1 "Cinzel",Georgia,serif;letter-spacing:.08em;color:#eee5ce;padding:10px 13px;border-radius:8px;cursor:pointer;background:rgba(28,35,38,.82);border:1px solid rgba(243,236,216,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.option:hover{filter:brightness(1.2)}
.option:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.option:disabled{opacity:.45;cursor:not-allowed}
.go:disabled{opacity:.55;cursor:wait;filter:none}
@media(max-width:420px){.slab{padding:22px 20px 20px}.actions{gap:6px}.option{padding:9px 10px;font-size:10px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:620px){.slab{padding:18px 24px}.tip{display:none}}
.lan{animation:rise linear infinite}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}80%{opacity:.8}100%{opacity:0;transform:translate(30px,-240px)}}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap .35s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.35)}}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.fall,.sway,.glint,.mote,.fill::after,.lan,.flap,.spin{animation:none}.lan{opacity:.8}}
</style>
</head>

<main class="stage" id="stage">
 <h1 class="title" aria-label="The Drifting Land">
  <span class="the">THE</span>
  <span class="name" aria-hidden="true"><b>D</b>rifting <b>L</b>and</span>
  <div class="rule" aria-hidden="true"><i></i>
   <svg viewBox="0 0 40 52"><path d="M20 0 L24 20 L40 26 L24 32 L20 52 L16 32 L0 26 L16 20Z" fill="#f3ecd8"/><circle cx="20" cy="26" r="4" fill="#24509f"/></svg><i></i></div>
 </h1>

 <section class="slab" role="status" aria-live="polite">
  <span class="vine"></span>
  <p class="status" id="status">Waking the drift</p>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div class="fill" id="fill"></div></div>
  <div class="meta"><span id="stage-name">Preparing the skies</span><span class="pct" id="pct">0%</span></div>
  <p class="tip" id="tip"></p>
  <button class="go" id="go" type="button" disabled>Begin Journey</button>
   <div class="actions" aria-label="Loading screen options">
     <button class="option" id="settings" type="button">Settings</button>
     <button class="option" id="sound" type="button">Sound: On</button>
     <button class="option" id="slots" type="button" disabled>Save Slots</button>
   </div>
 </section>
</main>

<script>
(function(){
  var stages=[
    [0,"Waking the drift","Preparing the skies"],
    [18,"Charting the sky lanes","Loading terrain"],
    [38,"Stitching floating islands","Placing islands"],
    [58,"Raising the old ruins","Building ruins"],
    [76,"Calling the waterfalls","Simulating water"],
    [90,"Lighting the beacons","Final touches"],
    [100,"The drift is ready","Ready"]
  ];
  var tips=[
    "Islands drift slowly. A path that is gone now may return at dusk.",
    "Beacons keep your place in the world. Light one before you wander far.",
    "Follow the waterfalls. They always lead somewhere worth reaching.",
    "Look up. The highest islands hide the oldest ruins.",
    "The wind carries clues about what lies beyond the clouds."
  ];
  var $=function(id){return document.getElementById(id)};
  var fill=$("fill"),pct=$("pct"),status=$("status"),sname=$("stage-name"),bar=$("bar"),tip=$("tip"),go=$("go"),stage=$("stage");
  var p=0,timer,tipTimer,ti=0;

  function setTip(){
    tip.style.opacity=0;
    setTimeout(function(){tip.textContent=tips[ti%tips.length];ti++;tip.style.opacity=1},350);
  }
  function render(){
    var v=Math.round(p);
    fill.style.width=p+"%";pct.textContent=v+"%";bar.setAttribute("aria-valuenow",v);
    for(var i=stages.length-1;i>=0;i--){if(p>=stages[i][0]){status.textContent=stages[i][1];sname.textContent=stages[i][2];break}}
  }
  function setProgress(value,phase,label){
    p=Math.max(0,Math.min(100,Number(value)||0));
    if(phase) status.textContent=phase;
    if(label) sname.textContent=label;
    render();
    if(p>=100){
      stage.classList.add("done");
      go.disabled=false;
      tip.textContent="Your world is waiting.";
      tip.style.opacity=1;
    }
  }
  var ready=false;
  var soundOn=true;
  var $settings=$("settings"),$sound=$("sound"),$slots=$("slots");
  function send(type){
    window.parent.postMessage({type:type},"*");
  }
  window.addEventListener("message",function(event){
    if(event.source!==window.parent)return;
    var data=event.data||{};
    if(data.type==="drifting-land:progress"){
      ready=false;
      setProgress(data.progress,data.phase,data.label);
    }else if(data.type==="drifting-land:ready"){
      ready=true;
      setProgress(100,"The drift is ready","Ready");
      $slots.disabled=false;
    }else if(data.type==="drifting-land:sound"){
      soundOn=!!data.enabled;
      $sound.textContent="Sound: "+(soundOn?"On":"Off");
    }else if(data.type==="drifting-land:save-state"){
      $slots.disabled=!data.ready;
    }
  });
  go.addEventListener("click",function(){
    if(ready)send("drifting-land:begin");
  });
  $settings.addEventListener("click",function(){send("drifting-land:settings")});
  $sound.addEventListener("click",function(){
    soundOn=!soundOn;
    $sound.textContent="Sound: "+(soundOn?"On":"Off");
    send("drifting-land:toggle-sound");
  });
  $slots.addEventListener("click",function(){if(ready)send("drifting-land:save-slots")});
  render();
  setTip();

  /* drifting light motes */
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches){
    for(var i=0;i<26;i++){
      var m=document.createElement("span");m.className="mote";
      m.style.left=(Math.random()*100)+"vw";m.style.top=(30+Math.random()*65)+"vh";
      m.style.setProperty("--dx",(60+Math.random()*140)+"px");m.style.setProperty("--dy",(-60-Math.random()*120)+"px");
      m.style.animationDuration=(7+Math.random()*9)+"s";m.style.animationDelay=(-Math.random()*12)+"s";
      m.style.transform="scale("+(.6+Math.random()*.9)+")";
      document.body.appendChild(m);
    }
  }
})();
</script>
